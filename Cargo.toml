[package]
name = "dispatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Liang Li"]
description = "A small SSH batch-operation library: run commands and manage files across many servers in parallel, using your existing ~/.ssh/config."
license = "MIT"
readme = "README.md"
repository = "https://github.com/liliang-cn/dispatch"
homepage = "https://github.com/liliang-cn/dispatch"
keywords = ["ssh", "batch", "remote", "automation", "ops"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
openssh = "0.11"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
thiserror = "2"
dirs = "5"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
